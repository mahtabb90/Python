[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wellness-tracker"
version = "0.2.0"
description = "Wellness Tracker CLI (yoga + meditation) using mysql"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "colorama>=0.4.6",
    "tabulate>=0.9.0",
    "mysql-connector-python>=8.0",
]


[project.scripts]
wellness-tracker = "wellness_tracker.app.cli:run"

[tool.setuptools]

include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["wellness_tracker*"]
